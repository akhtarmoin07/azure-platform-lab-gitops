name: Validate GitOps

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  helm:
    name: Lint and render Argo CD
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4


      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.0.4

      - name: Add Argo Helm repository
        run: helm repo add argo https://argoproj.github.io/argo-helm

      - name: Build chart dependencies
        run: helm dependency build bootstrap/argocd

      - name: Lint chart
        run: helm lint bootstrap/argocd

      - name: Render manifests
        run: helm template argocd bootstrap/argocd --namespace argocd > /tmp/argocd-rendered.yaml

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0

      - name: Render cluster root
        run: kubectl kustomize clusters/lab > /tmp/cluster-root.yaml

      - name: Render namespace baselines
        run: kubectl kustomize platform/namespaces > /tmp/namespace-baselines.yaml
